name: Daily Swing Data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # Mo bis Fr, 22:30 UTC (nach US-Schluss)
  workflow_dispatch:           # manueller Start per Button

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Daten laden
        run: python fetch_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "Daten $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push fehlgeschlagen (Versuch $i), warte kurz und versuche erneut..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Push endgueltig fehlgeschlagen nach 5 Versuchen."
          exit 1
